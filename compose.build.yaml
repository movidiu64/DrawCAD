# Variantă care construiește imaginea local din sursă (fără GHCR):
#   docker compose -f compose.build.yaml up -d --build

name: cotare

services:
  cotare:
    build: .
    image: cotare:local
    container_name: cotare
    restart: unless-stopped
    ports:
      - "${COTARE_PORT:-8080}:8080"
    volumes:
      - ${COTARE_DATA_DIR:-./data}:/data
    environment:
      PUID: ${PUID:-99}
      PGID: ${PGID:-100}
      COTARE_MAX_UPLOAD_MB: ${COTARE_MAX_UPLOAD_MB:-200}
      COTARE_MAX_RENDER_PX: ${COTARE_MAX_RENDER_PX:-12000}
    security_opt:
      - no-new-privileges:true
