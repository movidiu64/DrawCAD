# Variantă care construiește imaginea pe server, din sursă (fără registry, fără token GHCR).
# Potrivită pentru Dockhand cu stack din Git: fișierul compose = compose.build.yaml.
#   docker compose -f compose.build.yaml up -d --build

name: drawcad

services:
  drawcad:
    build: .
    image: drawcad:local
    # reconstruiește la fiecare deploy, ca un redeploy după git sync să ia codul nou
    pull_policy: build
    container_name: drawcad
    restart: unless-stopped
    ports:
      - "${DRAWCAD_PORT:-${COTARE_PORT:-8478}}:8080"
    volumes:
      - ${DRAWCAD_DATA_DIR:-${COTARE_DATA_DIR:-/mnt/user/appdata/drawcad}}:/data
    environment:
      PUID: ${PUID:-99}
      PGID: ${PGID:-100}
      DRAWCAD_MAX_UPLOAD_MB: ${DRAWCAD_MAX_UPLOAD_MB:-${COTARE_MAX_UPLOAD_MB:-200}}
      DRAWCAD_MAX_RENDER_PX: ${DRAWCAD_MAX_RENDER_PX:-${COTARE_MAX_RENDER_PX:-12000}}
      DRAWCAD_RETENTION_DAYS: ${DRAWCAD_RETENTION_DAYS:-${COTARE_RETENTION_DAYS:-30}}
      # private = fiecare browser are documentele lui (implicit); personal = un singur utilizator,
      # documentele se văd din orice browser; session = ca private, doar până la închiderea browserului
      DRAWCAD_MODE: ${DRAWCAD_MODE:-private}
      DRAWCAD_MAX_PAGES: ${DRAWCAD_MAX_PAGES:-300}
      DRAWCAD_MAX_IMAGE_MPX: ${DRAWCAD_MAX_IMAGE_MPX:-400}
      # parolă opțională (utilizator „drawcad”); goală = fără parolă, ca în rețeaua de acasă
      DRAWCAD_PASSWORD: ${DRAWCAD_PASSWORD:-}
      DRAWCAD_OCR_LANG: ${DRAWCAD_OCR_LANG:-ron+eng}
    # întărire: fără privilegii în plus, sistem de fișiere doar-citire (se scrie doar în /data și /tmp),
    # număr limitat de procese; capabilitățile rămase servesc doar la pregătirea folderului /data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    read_only: true
    tmpfs:
      - /tmp:size=512m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      net.unraid.docker.webui: "http://[IP]:[PORT:8080]/"
