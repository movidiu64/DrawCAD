# Variantă care construiește imaginea pe server, din sursă (fără registry, fără token GHCR).
# Potrivită pentru Dockhand cu stack din Git: fișierul compose = compose.build.yaml.
#   docker compose -f compose.build.yaml up -d --build

name: cotare

services:
  cotare:
    build: .
    image: cotare:local
    # reconstruiește la fiecare deploy, ca un redeploy după git sync să ia codul nou
    pull_policy: build
    container_name: cotare
    restart: unless-stopped
    ports:
      - "${COTARE_PORT:-8478}:8080"
    volumes:
      - ${COTARE_DATA_DIR:-/mnt/user/appdata/cotare}:/data
    environment:
      PUID: ${PUID:-99}
      PGID: ${PGID:-100}
      COTARE_MAX_UPLOAD_MB: ${COTARE_MAX_UPLOAD_MB:-200}
      COTARE_MAX_RENDER_PX: ${COTARE_MAX_RENDER_PX:-12000}
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      net.unraid.docker.webui: "http://[IP]:[PORT:8080]/"
