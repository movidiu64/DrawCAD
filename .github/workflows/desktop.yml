name: Desktop Windows

# Desktop app: PyInstaller + Tesseract (Romanian, English) + Inno Setup installer.
# Every push to main builds and tests it. A v* tag (also the one GitHub creates when a release is
# published from the web page) attaches the installer and the ZIP to that tag's release, creating
# the release if it does not exist. Only the tag push triggers it: listening to `release` too ran
# two builds for one release, and the second one failed.
# To (re)attach the files to an existing release: Actions → Desktop Windows → Run workflow, tag = v1.2.3.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach the files to (e.g. v1.0.0); empty = just build"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"  # diacritics in the test logs
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Version
        id: ver
        run: |
          $tag = "${{ inputs.tag }}"
          if (-not $tag -and "${{ github.ref_type }}" -eq "tag") { $tag = "${{ github.ref_name }}" }
          if ($tag) { $v = $tag.TrimStart("v") } else { $v = "0.0.0-dev.${{ github.run_number }}" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Set-Content -Path frontend/version.txt -Value $v -Encoding ascii -NoNewline
          Write-Host "Version: $v"

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r desktop/requirements.txt

      - name: Tesseract (Romanian + English) for the package
        run: |
          # the official Windows installer from Tesseract's GitHub release (checksum pinned), not the
          # Chocolatey feed, which is sometimes down (503)
          $v = "5.5.3"; $build = "20260724"
          $sha = "bee9e3434bd94fd65387d9be28cd467a41f61b1275383b55b0f59a1331270ae4"
          $url = "https://github.com/tesseract-ocr/tesseract/releases/download/$v/tesseract-ocr-w64-setup-$v.$build.exe"
          $exe = Join-Path $env:RUNNER_TEMP "tesseract-setup.exe"
          for ($i = 1; $i -le 4; $i++) {
            try { Invoke-WebRequest $url -OutFile $exe; break }
            catch { if ($i -eq 4) { throw }; Write-Host "download failed ($($_.Exception.Message)), retry $i"; Start-Sleep (15 * $i) }
          }
          if ((Get-FileHash $exe -Algorithm SHA256).Hash.ToLower() -ne $sha) { Write-Host "::error::Tesseract installer checksum mismatch"; exit 1 }
          $src = "C:\Program Files\Tesseract-OCR"
          # NSIS: silent, the folder last and unquoted
          Start-Process -FilePath $exe -ArgumentList "/S /D=$src" -Wait
          if (-not (Test-Path "$src\tesseract.exe")) { Write-Host "::error::Tesseract was not installed in $src"; exit 1 }
          $dst = Join-Path $env:RUNNER_TEMP "tesseract"
          New-Item -ItemType Directory -Force "$dst\tessdata\configs" | Out-Null
          Copy-Item "$src\*.exe", "$src\*.dll" $dst
          Copy-Item "$src\tessdata\eng.traineddata", "$src\tessdata\osd.traineddata" "$dst\tessdata"
          Copy-Item "$src\tessdata\configs\*" "$dst\tessdata\configs"
          Get-ChildItem $src -File | Where-Object { $_.Name -match "LICENSE|COPYING|AUTHORS|README" } | Copy-Item -Destination $dst
          Invoke-WebRequest "https://github.com/tesseract-ocr/tessdata_fast/raw/main/ron.traineddata" -OutFile "$dst\tessdata\ron.traineddata"
          # we do not need the training tools: only tesseract.exe
          Get-ChildItem $dst -Filter *.exe | Where-Object { $_.Name -ne "tesseract.exe" } | Remove-Item
          & "$dst\tesseract.exe" --list-langs
          $mb = [math]::Round(((Get-ChildItem $dst -Recurse | Measure-Object Length -Sum).Sum / 1MB), 1)
          Write-Host "::notice::Tesseract in the package: $mb MB"
          "TESSERACT_DIR=$dst" >> $env:GITHUB_ENV

      - name: LibreDWG (dwg2dxf, for opening DWG) for the package
        run: |
          $v = "0.14"
          $sha = "1ad7e15344d20b3426c3435b078d82fb84b35062815946b2cca9c5fc9810fea8"
          $zip = Join-Path $env:RUNNER_TEMP "libredwg.zip"
          Invoke-WebRequest "https://github.com/LibreDWG/libredwg/releases/download/$v/libredwg-$v-win64.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne $sha) { Write-Host "::error::LibreDWG zip checksum mismatch"; exit 1 }
          $tmp = Join-Path $env:RUNNER_TEMP "libredwg-all"
          Expand-Archive $zip -DestinationPath $tmp -Force
          $dst = Join-Path $env:RUNNER_TEMP "libredwg"
          New-Item -ItemType Directory -Force $dst | Out-Null
          # dwg2dxf.exe needs only libredwg-0.dll (and Windows' own kernel32 / msvcrt)
          Copy-Item "$tmp\dwg2dxf.exe", "$tmp\libredwg-0.dll", "$tmp\README.txt" $dst
          Copy-Item "desktop\licenses\LibreDWG-COPYING.txt" "$dst\COPYING.txt"
          Set-Content -Path "$dst\SOURCE.txt" -Encoding ascii -Value "GNU LibreDWG $v (GPL-3.0-or-later), unmodified Windows build from https://github.com/LibreDWG/libredwg/releases/tag/$v`r`nSource: https://github.com/LibreDWG/libredwg/releases/download/$v/libredwg-$v.tar.xz"
          & "$dst\dwg2dxf.exe" --version
          "LIBREDWG_DIR=$dst" >> $env:GITHUB_ENV

      - name: PyInstaller
        run: pyinstaller desktop/drawcad.spec --noconfirm --distpath dist --workpath build

      - name: Self-test on the executable
        run: |
          $rep = Join-Path $env:RUNNER_TEMP "selftest.json"
          $p = Start-Process -FilePath "dist\DrawCAD\DrawCAD.exe" -ArgumentList "--selftest", "--report", "`"$rep`"" -Wait -PassThru
          if (Test-Path $rep) {
            Get-Content $rep -Raw | Write-Host
            $j = Get-Content $rep -Raw | ConvertFrom-Json
            Write-Host "::notice::Self-test: OCR $($j.steps.ocr.lang) → $($j.steps.ocr.texts -join ' / '); DXF scan: $($j.steps.scan_dxf.stats | ConvertTo-Json -Compress)"
          } else { Write-Host "::error::the self-test did not write its report" }
          if ($p.ExitCode -ne 0) {
            $j = Get-Content $rep -Raw -ErrorAction SilentlyContinue
            Write-Host "::error::Self-test failed (code $($p.ExitCode)): $($j -replace "`r?`n", ' ')"
            $log = Join-Path $env:LOCALAPPDATA "DrawCAD\drawcad.log"
            if (Test-Path $log) { Write-Host "::error::Log: $((Get-Content $log -Raw) -replace "`r?`n", ' | ')" }
            exit 1
          }

      - name: Browser test on the executable
        run: |
          $srv = Start-Process -FilePath "dist\DrawCAD\DrawCAD.exe" -ArgumentList "--server-only", "--port", "8080" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try { Invoke-RestMethod http://127.0.0.1:8080/api/health | Out-Null; $ok = $true; break } catch { Start-Sleep 1 }
          }
          if (-not $ok) { Write-Host "::error::The server in the executable does not respond"; exit 1 }
          pip install playwright
          python -m playwright install chromium
          New-Item -ItemType Directory -Force e2e_out | Out-Null
          python tools/e2e_smoke.py http://127.0.0.1:8080 e2e_out *> e2e_out/e2e.log
          $code = $LASTEXITCODE
          Get-Content e2e_out/e2e.log | Select-Object -Last 30 | Write-Host
          Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue
          if ($code -ne 0) {
            $why = (Get-Content e2e_out/e2e.log | Select-String -Pattern "^E2E FAILED|^  » |^CONSOLE ERRORS" | Select-Object -First 10 | ForEach-Object { $_.Line }) -join ' | '
            if (-not $why) { $why = (Get-Content e2e_out/e2e.log | Select-Object -Last 15) -join ' | ' }
            Write-Host "::error::e2e on the executable failed: $why"
            $log = Join-Path $env:LOCALAPPDATA "DrawCAD\drawcad.log"
            if (Test-Path $log) { Write-Host "::error::Server log: $((Get-Content $log -Tail 20) -join ' | ')" }
            exit 1
          }

      - name: Installer (Inno Setup)
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "/DSrcDir=..\dist\DrawCAD" desktop\drawcad.iss
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Inno Setup failed"; exit 1 }
          Compress-Archive -Path dist\DrawCAD\* -DestinationPath "dist\DrawCAD-${{ steps.ver.outputs.version }}-portabil.zip"
          Get-ChildItem dist -File | ForEach-Object { Write-Host "::notice::$($_.Name): $([math]::Round($_.Length / 1MB, 1)) MB" }

      # Artifacts count against the account's shared storage (~230 MB per build here): keep
      # them only briefly. Releases (v* tags) are not affected and stay.
      - uses: actions/upload-artifact@v6
        # Release builds attach the files to the release instead (saves artifact storage).
        if: steps.ver.outputs.tag == ''
        continue-on-error: true
        with:
          name: DrawCAD-windows
          path: |
            dist/DrawCAD-*-setup.exe
            dist/DrawCAD-*-portabil.zip
          retention-days: 2

      - uses: actions/upload-artifact@v6
        if: failure()
        continue-on-error: true
        with:
          name: e2e-windows
          path: e2e_out
          retention-days: 2

      - name: Release
        if: steps.ver.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $files = (Get-ChildItem dist -File -Include *-setup.exe, *-portabil.zip -Recurse).FullName
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            # release already published from the web page: attach the files to it
            gh release upload $tag $files --clobber --repo "${{ github.repository }}"
          } else {
            # a tag like v1.1.0-rc.1 makes a pre-release, never the "Latest" one
          $pre = @(); if ($tag -match "-") { $pre = @("--prerelease") }
          gh release create $tag $files @pre --repo "${{ github.repository }}" `
              --title "DrawCAD ${{ steps.ver.outputs.version }}" --notes "Installer for Windows 10/11 (64-bit) and the portable version (ZIP). The installer is not code-signed: if SmartScreen shows 'Windows protected your PC', click More info, then Run anyway."
          }
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Could not attach the files to release $tag"; exit 1 }
