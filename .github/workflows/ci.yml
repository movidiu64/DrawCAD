name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild and publish to GHCR (e.g. v1.0.0); empty = just test"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Python dependencies
        run: pip install -r backend/requirements.txt
      - name: Tesseract (OCR)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-ron
      - name: Project rules (colors, i18n, overlays, agent skills)
        run: python tools/check_rules.py
      - name: Backend tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
      - name: Frontend tests (ISO 286, dimension geometry)
        working-directory: frontend
        run: npm test

  docker:
    needs: test
    runs-on: ubuntu-latest
    env:
      # refs/tags/vX.Y.Z on a tag push or on a manual run with a tag, otherwise the pushed ref
      REF: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.REF }}
      - name: Image name
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Version (shown in Settings)
        id: ver
        run: |
          if [ "${REF#refs/tags/v}" != "$REF" ]; then v="${REF#refs/tags/v}"; else v="$(cat VERSION) (${GITHUB_SHA::7})"; fi
          echo "v=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Build the image
        uses: docker/build-push-action@v7
        env:
          # No build-record artifact and no job summary: the upload counts against the
          # artifact storage quota, and a full quota failed the whole job.
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          load: true
          build-args: DRAWCAD_VERSION=${{ steps.ver.outputs.v }}
          tags: ${{ steps.img.outputs.name }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate the compose files
        run: |
          docker compose -f compose.yaml config -q
          docker compose -f compose.build.yaml config -q
      - name: Start the container (data folder mounted, owned by another user)
        run: |
          mkdir -p "$RUNNER_TEMP/cotdata"
          docker run -d --name drawcad -p 8080:8080 -v "$RUNNER_TEMP/cotdata:/data" \
            -e PUID=99 -e PGID=100 --security-opt no-new-privileges:true \
            --cap-drop ALL --cap-add CHOWN --cap-add SETUID --cap-add SETGID --cap-add DAC_OVERRIDE --cap-add FOWNER \
            --read-only --tmpfs /tmp:size=512m --pids-limit 256 \
            ${{ steps.img.outputs.name }}:test
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8080/api/health
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Browser test on the container
        run: |
          pip install -r backend/requirements.txt playwright
          python -m playwright install --with-deps chromium
          mkdir -p e2e_out
          python tools/e2e_smoke.py http://127.0.0.1:8080 e2e_out 2>&1 | tee e2e_out/e2e.log
          test "${PIPESTATUS[0]}" = 0
      - name: Security check on the container
        run: |
          python tools/security_smoke.py http://127.0.0.1:8080 2>&1 | tee e2e_out/security.log
          test "${PIPESTATUS[0]}" = 0
      - name: Check the user and permissions
        run: |
          docker exec drawcad grep -E "^(Uid|Gid):" /proc/1/status
          docker exec drawcad grep -qE "^Uid:[[:space:]]+99[[:space:]]" /proc/1/status
          test "$(stat -c %u:%g "$RUNNER_TEMP/cotdata/docs")" = "99:100"
          ls -ln "$RUNNER_TEMP/cotdata/docs" | head
      - name: Container log
        if: always()
        run: docker logs drawcad
      - name: Diagnostics (last lines as annotations)
        if: failure()
        run: |
          for f in e2e_out/e2e.log e2e_out/security.log; do
            [ -f "$f" ] || continue
            # the step that failed (line in e2e_smoke.py), what it waited for, then the last lines
            grep -m1 'E2E FAILED' "$f" | sed "s|^|::error title=$f (step)::|"
            grep -m2 'waiting for' "$f" | sed 's|^ *||' | sed "s|^|::error title=$f (waiting for)::|"
            grep -v '^ ' "$f" | tail -n 3 | sed "s|^|::error title=$f::|"
          done
          docker ps -a --format '{{.Names}} {{.Status}}' | sed 's|^|::error title=docker ps::|'
          docker logs drawcad 2>&1 | grep -v '" 200' | tail -n 5 | sed 's|^|::error title=container::|'
          true
      - uses: actions/upload-artifact@v6
        # Screenshots and logs only when something failed (saves artifact storage).
        if: failure()
        continue-on-error: true
        with:
          name: e2e
          path: e2e_out
          retention-days: 2
      - name: Publish the image to GHCR
        # main → :latest and :<commit sha>; a v1.2.3 tag (pushed, or given to a manual run) → :1.2.3 and :1.2
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && startsWith(env.REF, 'refs/tags/v'))
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          img="${{ steps.img.outputs.name }}"
          if [ "${REF#refs/tags/v}" != "$REF" ]; then
            ver="${REF#refs/tags/v}"
            tags="$ver"
            minor="$(echo "$ver" | sed -nE 's/^([0-9]+\.[0-9]+)\.[0-9]+$/\1/p')"
            [ -n "$minor" ] && tags="$tags $minor"
          else
            tags="latest $(git rev-parse HEAD)"
          fi
          for t in $tags; do
            docker tag "$img:test" "$img:$t"
            docker push "$img:$t"
          done
