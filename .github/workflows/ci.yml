name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependențe Python
        run: pip install -r backend/requirements.txt
      - name: Teste backend
        working-directory: backend
        run: python -m unittest discover -s tests -v
      - name: Teste frontend (ISO 286, geometrie cote)
        working-directory: frontend
        run: npm test

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Numele imaginii
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Construiește imaginea
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.img.outputs.name }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validează fișierele compose
        run: |
          docker compose -f compose.yaml config -q
          docker compose -f compose.build.yaml config -q
      - name: Pornește containerul (folder de date montat, deținut de alt utilizator)
        run: |
          mkdir -p "$RUNNER_TEMP/cotdata"
          docker run -d --name drawcad -p 8080:8080 -v "$RUNNER_TEMP/cotdata:/data" \
            -e PUID=99 -e PGID=100 --security-opt no-new-privileges:true \
            --cap-drop ALL --cap-add CHOWN --cap-add SETUID --cap-add SETGID --cap-add DAC_OVERRIDE --cap-add FOWNER \
            --read-only --tmpfs /tmp:size=512m --pids-limit 256 \
            ${{ steps.img.outputs.name }}:test
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8080/api/health
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test în browser pe container
        run: |
          pip install -r backend/requirements.txt playwright
          python -m playwright install --with-deps chromium
          mkdir -p e2e_out
          python tools/e2e_smoke.py http://127.0.0.1:8080 e2e_out 2>&1 | tee e2e_out/e2e.log
          test "${PIPESTATUS[0]}" = 0
      - name: Verificare de securitate pe container
        run: |
          python tools/security_smoke.py http://127.0.0.1:8080 2>&1 | tee e2e_out/security.log
          test "${PIPESTATUS[0]}" = 0
      - name: Verifică utilizatorul și permisiunile
        run: |
          docker exec drawcad grep -E "^(Uid|Gid):" /proc/1/status
          docker exec drawcad grep -qE "^Uid:[[:space:]]+99[[:space:]]" /proc/1/status
          test "$(stat -c %u:%g "$RUNNER_TEMP/cotdata/docs")" = "99:100"
          ls -ln "$RUNNER_TEMP/cotdata/docs" | head
      - name: Jurnal container
        if: always()
        run: docker logs drawcad
      - name: Diagnostic (ultimele linii ca adnotări)
        if: failure()
        run: |
          for f in e2e_out/e2e.log e2e_out/security.log; do
            [ -f "$f" ] && grep -v '^ ' "$f" | tail -n 3 | sed "s|^|::error title=$f::|"
          done
          docker ps -a --format '{{.Names}} {{.Status}}' | sed 's|^|::error title=docker ps::|'
          docker logs drawcad 2>&1 | grep -v '" 200' | tail -n 5 | sed 's|^|::error title=container::|'
          true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e
          path: e2e_out
      - name: Publică imaginea în GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag ${{ steps.img.outputs.name }}:test ${{ steps.img.outputs.name }}:latest
          docker tag ${{ steps.img.outputs.name }}:test ${{ steps.img.outputs.name }}:${{ github.sha }}
          docker push ${{ steps.img.outputs.name }}:latest
          docker push ${{ steps.img.outputs.name }}:${{ github.sha }}
