# DrawCAD — stack for Dockhand / docker compose
# The image is built and tested by GitHub Actions on every push to main.
# All ${...} values can be overridden from the stack variables (see .env.example).

name: drawcad

services:
  drawcad:
    image: ghcr.io/movidiu64/drawcad:${DRAWCAD_TAG:-${COTARE_TAG:-latest}}
    container_name: drawcad
    restart: unless-stopped
    pull_policy: always
    ports:
      - "${DRAWCAD_PORT:-${COTARE_PORT:-8478}}:8080"
    volumes:
      # uploaded documents and their state (dimensions, settings)
      - ${DRAWCAD_DATA_DIR:-${COTARE_DATA_DIR:-/mnt/user/appdata/drawcad}}:/data
    environment:
      PUID: ${PUID:-99}
      PGID: ${PGID:-100}
      DRAWCAD_MAX_UPLOAD_MB: ${DRAWCAD_MAX_UPLOAD_MB:-${COTARE_MAX_UPLOAD_MB:-200}}
      DRAWCAD_MAX_RENDER_PX: ${DRAWCAD_MAX_RENDER_PX:-${COTARE_MAX_RENDER_PX:-12000}}
      DRAWCAD_RETENTION_DAYS: ${DRAWCAD_RETENTION_DAYS:-${COTARE_RETENTION_DAYS:-30}}
      # private = each browser has its own documents (default); personal = a single user,
      # documents are visible from any browser; session = like private, only until the browser closes
      DRAWCAD_MODE: ${DRAWCAD_MODE:-private}
      DRAWCAD_MAX_PAGES: ${DRAWCAD_MAX_PAGES:-300}
      DRAWCAD_MAX_IMAGE_MPX: ${DRAWCAD_MAX_IMAGE_MPX:-400}
      # optional password (user "drawcad"); empty = no password, as on a home network
      DRAWCAD_PASSWORD: ${DRAWCAD_PASSWORD:-}
      DRAWCAD_OCR_LANG: ${DRAWCAD_OCR_LANG:-ron+eng}
    # hardening: no extra privileges, read-only filesystem (writes only to /data and /tmp),
    # limited number of processes; the remaining capabilities only serve to prepare the /data folder
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    read_only: true
    tmpfs:
      - /tmp:size=512m
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      # the WebUI button on the Unraid Docker page
      net.unraid.docker.webui: "http://[IP]:[PORT:8080]/"
