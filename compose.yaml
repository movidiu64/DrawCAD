# DrawCAD — stack pentru Dockhand / docker compose
# Imaginea e construită și testată de GitHub Actions la fiecare push pe main.
# Toate valorile ${...} se pot suprascrie din variabilele stack-ului (vezi .env.example).

name: drawcad

services:
  drawcad:
    image: ghcr.io/gg64nou/drawcad:${DRAWCAD_TAG:-${COTARE_TAG:-latest}}
    container_name: drawcad
    restart: unless-stopped
    pull_policy: always
    ports:
      - "${DRAWCAD_PORT:-${COTARE_PORT:-8478}}:8080"
    volumes:
      # documentele încărcate și starea lor (cotele, setările)
      - ${DRAWCAD_DATA_DIR:-${COTARE_DATA_DIR:-/mnt/user/appdata/drawcad}}:/data
    environment:
      PUID: ${PUID:-99}
      PGID: ${PGID:-100}
      DRAWCAD_MAX_UPLOAD_MB: ${DRAWCAD_MAX_UPLOAD_MB:-${COTARE_MAX_UPLOAD_MB:-200}}
      DRAWCAD_MAX_RENDER_PX: ${DRAWCAD_MAX_RENDER_PX:-${COTARE_MAX_RENDER_PX:-12000}}
      DRAWCAD_RETENTION_DAYS: ${DRAWCAD_RETENTION_DAYS:-${COTARE_RETENTION_DAYS:-30}}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      # butonul WebUI din pagina Docker a Unraid
      net.unraid.docker.webui: "http://[IP]:[PORT:8080]/"
